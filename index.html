<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090A" />
    <meta name="description" content="3x3 Albania, Shkoder. Rezultate live, skuadrat, klasifikimi dhe faza eliminatore e edicionit te 11-te." />
    <link rel="icon" type="image/png" href="/logos/3x3-320.png" />
    <link rel="apple-touch-icon" href="/logos/3x3-320.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Russo+One&display=swap"
      rel="stylesheet"
    />
    <title>3x3 Albania | Shkoder</title>
    <!--
      Boot skeleton. Inline on purpose: it has to paint while the JS bundle is
      still downloading, so it cannot depend on anything the bundle ships.
      React clears #root on its first render, which removes all of this.
    -->
    <style>
      #boot {
        background: #08090a;
        min-height: 100dvh;
      }
      #boot .sk {
        display: block;
        background-color: #1c1e22;
        background-image: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.06) 42%,
          rgba(255, 195, 0, 0.13) 50%,
          rgba(255, 255, 255, 0.06) 58%,
          transparent 100%
        );
        background-repeat: no-repeat;
        background-size: 150% 100%;
        animation: bootSweep 1.3s ease-in-out infinite;
      }
      @keyframes bootSweep {
        from {
          background-position: -150% 0;
        }
        to {
          background-position: 150% 0;
        }
      }
      #boot .hdr {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-bottom: 2px solid #ffc300;
        padding-top: calc(8px + env(safe-area-inset-top));
      }
      #boot .chips {
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 2px solid #2b2e33;
      }
      #boot .band {
        border-top: 2px solid #2b2e33;
        border-bottom: 2px solid #2b2e33;
        padding: 8px 12px;
        background: #1c1e22;
      }
      #boot .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid #2b2e33;
      }
      #boot .col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #boot .wrap {
        margin: 0 auto;
        max-width: 48rem;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .sk {
          animation: none;
          background-image: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Duke u ngarkuar">
        <div class="hdr">
          <span class="sk" style="width: 52px; height: 35px"></span>
          <span class="col" style="max-width: 130px">
            <span class="sk" style="height: 13px"></span>
            <span class="sk" style="height: 9px; width: 60%"></span>
          </span>
        </div>
        <div class="chips">
          <span class="sk" style="width: 56px; height: 40px"></span>
          <span class="sk" style="width: 84px; height: 40px"></span>
          <span class="sk" style="width: 72px; height: 40px"></span>
        </div>
        <div class="wrap">
          <div class="band"><span class="sk" style="width: 120px; height: 14px"></span></div>
          <div class="row">
            <span class="sk" style="width: 56px; height: 26px"></span>
            <span class="col">
              <span class="sk" style="height: 14px; width: 62%"></span>
              <span class="sk" style="height: 14px; width: 48%"></span>
            </span>
          </div>
          <div class="row">
            <span class="sk" style="width: 56px; height: 26px"></span>
            <span class="col">
              <span class="sk" style="height: 14px; width: 54%"></span>
              <span class="sk" style="height: 14px; width: 66%"></span>
            </span>
          </div>
          <div class="row">
            <span class="sk" style="width: 56px; height: 26px"></span>
            <span class="col">
              <span class="sk" style="height: 14px; width: 70%"></span>
              <span class="sk" style="height: 14px; width: 44%"></span>
            </span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
